<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Friendsgiving | Day-of Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>:root{color-scheme:light;--wine:#7a1525;--cream:#fbf1e3;--line:#dec2b6}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--wine);font-family:Georgia,serif}.wrap{max-width:1000px;margin:auto;padding:16px}header{text-align:center}h1{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(32px,6vw,52px);margin:8px 0}h2{font-size:19px}.sub{font-size:12px;opacity:.75}#countdown{font-size:clamp(30px,8vw,58px);font-variant-numeric:tabular-nums;font-weight:bold;letter-spacing:2px}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.tasks{display:grid;gap:5px}.task{display:grid;grid-template-columns:minmax(0,1fr) 94px auto;align-items:center;gap:8px;padding:8px 10px;background:#fffaf3;border:1px solid var(--line);border-radius:8px;min-height:52px}.task.done{opacity:.6}.name{font-weight:bold;overflow-wrap:anywhere;font-size:14px}.detail{font-size:11px;opacity:.7;margin-top:3px}.timer{font:600 14px ui-monospace,monospace;text-align:right;font-variant-numeric:tabular-nums}.actions{display:flex;gap:4px;align-items:center}button,.back{background:var(--wine);color:white;border:1px solid var(--wine);border-radius:6px;padding:7px 10px;cursor:pointer;font-size:12px}button.alt{background:transparent;color:var(--wine)}button:disabled{opacity:.4;cursor:default}input{padding:9px;border:1px solid var(--line);border-radius:6px;min-width:0;background:white}form{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}form input:first-child{flex:1 1 220px}form input[type=number]{width:85px}.notice{font-size:12px;background:#f3e2d9;padding:9px;border-radius:6px;margin:12px 0}.back{display:inline-block;text-decoration:none;background:transparent;color:var(--wine)}@media(max-width:540px){.task{grid-template-columns:minmax(0,1fr) 76px auto;gap:5px;padding:7px 6px}.timer{font-size:12px}.actions button{padding:6px}.name{font-size:12px}.detail{font-size:10px}}</style></head><body><main class="wrap"><a class="back" href="./">← Back to Friendsgiving</a><header><div class="sub">THE GARRETTS' FRIENDSGIVING</div><h1>Day-of Countdown</h1><div id="countdown" role="timer">--:--:--</div><div class="sub">Saturday, November 21, 2026 · 2:00 PM Pacific</div></header>
<div class="notice">Tasks are saved on this device only. This page is not password-protected or synchronized across guests' phones.</div><div class="bar"><h2>Cooking & setup tasks</h2><span id="progress"></span></div><section id="tasks" class="tasks" aria-label="Day-of tasks"></section>
<form id="add"><input id="taskName" maxlength="100" required placeholder="Add a task" aria-label="New task"><input id="duration" type="number" min="1" max="1440" value="30" required aria-label="Estimated minutes"><button type="submit">+ Add task</button></form><button class="alt" id="reset">Reset all tasks</button></main>
<script>
const key="garrett-friendsgiving-dayof-v1";
const defaults=[["Turkey #1",138],["Turkey #2",138],["Spiral ham",110],["Green bean casserole",40],["Sweet potato casserole",40],["Mac & cheese",40],["Mashed potatoes",45],["Gravy",15],["Set up food station",30]];
let tasks;try{tasks=JSON.parse(localStorage.getItem(key))}catch{}if(!Array.isArray(tasks))tasks=defaults.map(([name,minutes])=>({id:crypto.randomUUID(),name,minutes,status:"idle",started:null,elapsed:0,firstStart:null,finished:null}));
const $=id=>document.getElementById(id),save=()=>localStorage.setItem(key,JSON.stringify(tasks));
const fmt=s=>{s=Math.max(0,Math.floor(s));return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,"0")).join(":")};
const when=ms=>ms?new Date(ms).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}):"Not started";
const elapsed=t=>t.elapsed+(t.status==="running"?Math.max(0,Date.now()-t.started):0);
function render(){const host=$("tasks");host.replaceChildren();tasks.forEach(t=>{const row=document.createElement("div");row.className="task"+(t.status==="done"?" done":"");const left=document.createElement("div");const title=document.createElement("div");title.className="name";title.textContent=t.name;const detail=document.createElement("div");detail.className="detail";detail.textContent=(t.firstStart?"Started "+when(t.firstStart):"Est. "+t.minutes+" min")+(t.finished?" · Finished "+when(t.finished):"")+(t.status==="paused"?" · Paused":"");left.append(title,detail);const time=document.createElement("div");time.className="timer";time.dataset.timer=t.id;time.textContent=fmt(elapsed(t)/1000);const actions=document.createElement("div");actions.className="actions";
function button(label,cls,fn,disabled=false){const b=document.createElement("button");b.type="button";b.textContent=label;b.className=cls;b.disabled=disabled;b.addEventListener("click",fn);actions.append(b)}
if(t.status==="idle"||t.status==="paused")button("▶","",()=>{t.status="running";t.started=Date.now();t.firstStart??=t.started;save();render()});
if(t.status==="running")button("Ⅱ","alt",()=>{t.elapsed=elapsed(t);t.started=null;t.status="paused";save();render()});
if(t.status!=="done")button("✓","alt",()=>{t.elapsed=elapsed(t);t.started=null;t.status="done";t.finished=Date.now();save();render()});
if(t.status==="done")button("↺","alt",()=>{t.status="idle";t.started=null;t.elapsed=0;t.firstStart=null;t.finished=null;save();render()});
button("×","alt",()=>{if(confirm("Delete "+t.name+"?")){tasks=tasks.filter(x=>x.id!==t.id);save();render()}});
row.append(left,time,actions);host.append(row)});$("progress").textContent=tasks.filter(t=>t.status==="done").length+" / "+tasks.length+" completed"}
function tick(){const seconds=Math.max(0,Math.floor((new Date("2026-11-21T14:00:00-08:00").getTime()-Date.now())/1000));$("countdown").textContent=seconds?fmt(seconds):"00:00:00";for(const t of tasks){const el=document.querySelector('[data-timer="'+t.id+'"]');if(el)el.textContent=fmt(elapsed(t)/1000)}}
$("add").addEventListener("submit",e=>{e.preventDefault();const name=$("taskName").value.trim(),minutes=Number($("duration").value);if(!name||!Number.isInteger(minutes)||minutes<1)return;tasks.push({id:crypto.randomUUID(),name,minutes,status:"idle",started:null,elapsed:0,firstStart:null,finished:null});save();render();$("taskName").value=""});
$("reset").addEventListener("click",()=>{if(confirm("Reset all timers and task statuses?")){tasks=tasks.map(t=>({...t,status:"idle",started:null,elapsed:0,firstStart:null,finished:null}));save();render()}});
window.addEventListener("storage",e=>{if(e.key===key){try{tasks=JSON.parse(e.newValue)||[]}catch{tasks=[]}render()}});
render();tick();setInterval(tick,1000);
</script></body></html>
