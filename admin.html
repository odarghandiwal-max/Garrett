<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Friendsgiving | Day-of Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>:root{color-scheme:light;--wine:#7a1525;--cream:#fbf1e3;--line:#dec2b6}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--wine);font-family:Georgia,serif}.wrap{max-width:1000px;margin:auto;padding:16px}header{text-align:center}h1{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(32px,6vw,52px);margin:8px 0}h2{font-size:19px}.sub{font-size:12px;opacity:.75}#countdown{font-size:clamp(30px,8vw,58px);font-variant-numeric:tabular-nums;font-weight:bold;letter-spacing:2px}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.tasks{display:grid;gap:5px}.task{display:grid;grid-template-columns:minmax(0,1fr) 94px auto;align-items:center;gap:8px;padding:8px 10px;background:#fffaf3;border:1px solid var(--line);border-radius:8px;min-height:52px}.task.done{opacity:.6}.name{font-weight:bold;overflow-wrap:anywhere;font-size:14px}.detail{font-size:11px;opacity:.7;margin-top:3px}.timer{font:600 14px ui-monospace,monospace;text-align:right;font-variant-numeric:tabular-nums}.actions{display:flex;gap:4px;align-items:center}button,.back{background:var(--wine);color:white;border:1px solid var(--wine);border-radius:6px;padding:7px 10px;cursor:pointer;font-size:12px}button.alt{background:transparent;color:var(--wine)}button:disabled{opacity:.4;cursor:default}input{padding:9px;border:1px solid var(--line);border-radius:6px;min-width:0;background:white}form{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}form input:first-child{flex:1 1 220px}form input[type=number]{width:85px}.notice{font-size:12px;background:#f3e2d9;padding:9px;border-radius:6px;margin:12px 0}.back{display:inline-block;text-decoration:none;background:transparent;color:var(--wine)}@media(max-width:540px){.task{grid-template-columns:minmax(0,1fr) 76px auto;gap:5px;padding:7px 6px}.timer{font-size:12px}.actions button{padding:6px}.name{font-size:12px}.detail{font-size:10px}}</style></head><body><main class="wrap"><a class="back" href="./">← Back to Friendsgiving</a><header><div class="sub">THE GARRETTS' FRIENDSGIVING</div><h1>Day-of Countdown</h1><div id="countdown" role="timer">--:--:--</div><div class="sub">Saturday, November 21, 2026 · 2:00 PM Pacific</div></header>
<div class="notice"><span id="connection">Connecting…</span> No password required; everyone can edit.</div><div class="bar"><h2>Cooking & setup tasks</h2><span id="progress"></span></div><section id="tasks" class="tasks" aria-label="Day-of tasks"></section>
<form id="add"><input id="taskName" maxlength="100" required placeholder="Add a task" aria-label="New task"><input id="duration" type="number" min="1" max="1440" value="30" required aria-label="Estimated minutes"><button type="submit">+ Add task</button></form><button class="alt" id="reset">Reset all tasks</button></main>
<script>
const API="https://hefwxmhdgkeqtyyfpwub.supabase.co/rest/v1/garrett_day_tasks",KEY="sb_publishable_VJjXv7HOU5zyT4SAQWvl7w_iFU0h5cx";
const $=id=>document.getElementById(id);let tasks=[],busy=false,ready=false,offline=false;const LOCAL_KEY="garrett-friendsgiving-dayof-v1";const defaults=[["Turkey #1",138],["Turkey #2",138],["Spiral ham",110],["Green bean casserole",40],["Sweet potato casserole",40],["Mac & cheese",40],["Mashed potatoes",45],["Gravy",15],["Set up food station",30]];function localLoad(){try{const old=JSON.parse(localStorage.getItem(LOCAL_KEY));if(Array.isArray(old)&&old.length)return old.map((t,i)=>({id:t.id||crypto.randomUUID(),name:t.name,minutes:t.minutes||30,status:t.status||"idle",elapsed_ms:t.elapsed_ms??t.elapsed??0,started_at:t.started_at||(t.started?new Date(t.started).toISOString():null),first_started_at:t.first_started_at||(t.firstStart?new Date(t.firstStart).toISOString():null),finished_at:t.finished_at||(t.finished?new Date(t.finished).toISOString():null),sort_order:i+1}))}catch(e){console.warn(e)}return defaults.map(([name,minutes],i)=>({id:crypto.randomUUID(),name,minutes,status:"idle",elapsed_ms:0,started_at:null,first_started_at:null,finished_at:null,sort_order:i+1}))}function localSave(){localStorage.setItem(LOCAL_KEY,JSON.stringify(tasks))}
const fmt=x=>{x=Math.max(0,Math.floor(x));return [Math.floor(x/3600),Math.floor(x%3600/60),x%60].map(n=>String(n).padStart(2,"0")).join(":")};
const elapsed=t=>Number(t.elapsed_ms||0)+(t.status==="running"&&t.started_at?Math.max(0,Date.now()-Date.parse(t.started_at)):0);
const time=t=>new Date(t).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
async function request(method="",query="",body){const r=await fetch(API+query,{method,headers:{"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json","Prefer":"return=representation"},body:body===undefined?undefined:JSON.stringify(body),cache:"no-store"});if(!r.ok)throw Error(await r.text());return r.json()}
async function load(){if(busy)return;try{tasks=await request("GET","?select=*&order=sort_order.asc,updated_at.asc");ready=true;offline=false;$("connection").textContent="Shared board connected · refreshes every 3 seconds";render()}catch(e){if(!offline){tasks=localLoad();offline=true}ready=true;$("connection").textContent="Device-only mode: tasks saved in this browser. Supabase setup needed to share across devices.";render();console.error(e)}}
async function mutate(method,query,body){if(offline){if(method==="POST"){tasks.push({id:crypto.randomUUID(),...body,status:"idle",elapsed_ms:0,started_at:null,first_started_at:null,finished_at:null})}else if(method==="DELETE"){const id=query.split("eq.")[1];tasks=tasks.filter(t=>t.id!==id)}else if(method==="PATCH"){const id=query.split("eq.")[1];tasks=tasks.map(t=>id&&t.id!==id?t:{...t,...body})}localSave();render();return}busy=true;try{await request(method,query,body)}catch(e){alert("Could not save to shared board. Please try again.");console.error(e)}finally{busy=false;await load()}}
const update=(t,patch)=>mutate("PATCH","?id=eq."+t.id,{...patch,updated_at:new Date().toISOString()});
function render(){const root=$("tasks");root.replaceChildren();[...tasks].sort((a,b)=>{const rank=t=>t.status==="running"?0:t.status==="paused"?1:t.status==="idle"?2:3;const delta=rank(a)-rank(b);if(delta)return delta;if(rank(a)<=1){const remaining=t=>Math.max(0,t.minutes*60000-elapsed(t));return remaining(a)-remaining(b)}return (a.sort_order||0)-(b.sort_order||0)}).forEach(t=>{const row=document.createElement("div");row.className="task"+(t.status==="done"?" done":"");const info=document.createElement("div"),name=document.createElement("div"),detail=document.createElement("div");name.className="name";name.textContent=t.name;detail.className="detail";detail.textContent=(t.status==="running"||t.status==="paused"?"Remaining "+fmt(Math.max(0,t.minutes*60-elapsed(t)/1000))+" · ":"")+(t.first_started_at?"Started "+time(t.first_started_at):"Est. "+t.minutes+" min")+(t.finished_at?" · Finished "+time(t.finished_at):"")+(t.status==="paused"?" · Paused":"");info.append(name,detail);
const timer=document.createElement("div");timer.className="timer";timer.dataset.timer=t.id;timer.textContent=fmt(elapsed(t)/1000);
const actions=document.createElement("div");actions.className="actions";function btn(label,fn,alt=false){const b=document.createElement("button");b.type="button";b.textContent=label;b.className=alt?"alt":"";b.addEventListener("click",fn);actions.append(b)}
if(t.status==="idle"||t.status==="paused")btn("▶",()=>update(t,{status:"running",started_at:new Date().toISOString(),first_started_at:t.first_started_at||new Date().toISOString(),finished_at:null}));
if(t.status==="running")btn("Ⅱ",()=>update(t,{status:"paused",elapsed_ms:Math.floor(elapsed(t)),started_at:null}),true);
if(t.status!=="done")btn("✓",()=>update(t,{status:"done",elapsed_ms:Math.floor(elapsed(t)),started_at:null,finished_at:new Date().toISOString()}),true);
if(t.status==="done")btn("↺",()=>update(t,{status:"idle",elapsed_ms:0,started_at:null,first_started_at:null,finished_at:null}),true);
btn("×",()=>{if(confirm("Delete "+t.name+" for everyone?"))mutate("DELETE","?id=eq."+t.id)},true);
row.append(info,timer,actions);root.append(row)});$("progress").textContent=tasks.filter(t=>t.status==="done").length+" / "+tasks.length+" completed"}
function tick(){const remain=Math.max(0,Math.floor((Date.parse("2026-11-21T14:00:00-08:00")-Date.now())/1000));$("countdown").textContent=fmt(remain);tasks.forEach(t=>{const el=document.querySelector('[data-timer="'+t.id+'"]');if(el)el.textContent=fmt(elapsed(t)/1000)})}
$("add").addEventListener("submit",e=>{e.preventDefault();const name=$("taskName").value.trim(),minutes=Number($("duration").value);if(!ready||!name||!Number.isInteger(minutes)||minutes<1)return;mutate("POST","",{name,minutes,sort_order:tasks.length+1});$("taskName").value=""});
$("reset").addEventListener("click",()=>{if(ready&&confirm("Reset ALL tasks for everyone?"))mutate("PATCH","?id=not.is.null",{status:"idle",started_at:null,first_started_at:null,finished_at:null,elapsed_ms:0})});
tick();load();setInterval(tick,1000);setInterval(()=>{if(!document.hidden)load()},3000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
</script></body></html>
